<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeador Maestro CBM</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- PANTALLA DE LOGIN -->
    <div id="auth-container" class="auth-wrapper">
        <div class="auth-split">
            <!-- Left Side: Login Form -->
            <div class="auth-left">
                <div class="auth-form-container">
                    <div class="auth-brand">
                        <img src="logo.png" alt="A-MAQ Logo" class="auth-logo">
                        <span>A-MAQ S.A.</span>
                    </div>
                    
                    <div class="auth-user-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group icon-input">
                            <span class="input-icon">👤</span>
                            <input type="email" id="loginEmail" placeholder="CORREO ELECTRÓNICO" required>
                        </div>
                        <div class="form-group icon-input">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="loginPassword" placeholder="CONTRASEÑA" required>
                        </div>
                        
                        <div id="loginError" class="auth-error" style="display: none;">Credenciales no válidas</div>
                        
                        <button type="submit" class="btn-primary auth-submit" id="loginSubmitBtn">LOGIN</button>
                        
                        <div class="auth-options">
                            <label class="remember-me">
                                <input type="checkbox"> Recordarme
                            </label>
                            <a href="#" class="forgot-password">¿Olvilaste tu contraseña?</a>
                        </div>
                    </form>

                    <div class="auth-footer-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Welcome message with abstract background -->
            <div class="auth-right">
                <div class="auth-welcome-content">
                    <h1>Welcome.</h1>
                    <p>Accede al Planeador Maestro CBM de A-MAQ para gestionar tus tareas y cronogramas de mantenimiento predictivo.</p>
                </div>
                <div class="auth-signup-text">
                    ¿No tienes cuenta? <a href="#">Contáctanos</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pantalla de carga mientras se descarga la app (solo con sesión iniciada) -->
    <div id="boot-overlay" style="display:none; position:fixed; inset:0; z-index:99998; background:#0f172a; color:#e2e8f0; align-items:center; justify-content:center; flex-direction:column; gap:14px; font-family:'Montserrat',sans-serif;">
        <img src="logo.png" alt="A-MAQ" style="height:56px; width:auto;">
        <span style="font-size:0.85rem; letter-spacing:0.08em;">Cargando Planeador Maestro CBM…</span>
    </div>

    <!-- Supabase & SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Cargador: el código de la app (api/_private) solo se entrega con una sesión válida -->
    <script>
    (function () {
        const cfg = window._stagingConfig || {};
        const url = cfg.url || 'https://gvjemehvtrxwsokmyyby.supabase.co';
        const key = cfg.key || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2amVtZWh2dHJ4d3Nva215eWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NTkxOTMsImV4cCI6MjA4OTQzNTE5M30.TSVtuYnGI2j9JymCJbjKsXlbs1hG2EpaHHuEksJuAqE';
        let client = null;
        try { if (window.supabase) client = window.supabase.createClient(url, key); } catch (e) { console.error('Error initializing Supabase', e); }
        window._bootClient = client;   // app.js reutiliza este cliente para no duplicar la sesión

        let appLoaded = false, appLoading = false;
        const $ = id => document.getElementById(id);

        function showLoginError(msg) {
            const box = $('loginError');
            if (box) { box.textContent = msg; box.style.display = 'block'; }
        }
        function resetLoginButton() {
            const btn = $('loginSubmitBtn');
            if (btn) { btn.textContent = 'LOGIN'; btn.disabled = false; }
        }
        function overlay(show) {
            const o = $('boot-overlay');
            if (o) o.style.display = show ? 'flex' : 'none';
        }

        async function fetchPart(part, token) {
            const res = await fetch('/api/app?part=' + part, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-cache' });
            if (res.status === 401 || res.status === 403) throw Object.assign(new Error('Tu usuario no tiene acceso al planeador.'), { denied: true });
            if (!res.ok) throw new Error('No se pudo cargar la aplicación (' + res.status + '). Intenta de nuevo.');
            return res.text();
        }

        async function loadApp(session) {
            if (appLoaded || appLoading || !session) return;
            appLoading = true;
            overlay(true);
            try {
                const [shell, code] = await Promise.all([fetchPart('html', session.access_token), fetchPart('js', session.access_token)]);
                document.body.insertAdjacentHTML('beforeend', shell);
                const s = document.createElement('script');
                s.textContent = code;
                document.body.appendChild(s);
                appLoaded = true;
                // app.js llegó después de que la página terminó de cargar: se dispara a mano su arranque.
                document.dispatchEvent(new Event('DOMContentLoaded'));
            } catch (err) {
                console.error('Carga de la app:', err);
                showLoginError(err.message || 'Error de conexión inesperado.');
                if (err.denied && client) await client.auth.signOut();
            } finally {
                appLoading = false;
                overlay(false);
                if (!appLoaded) resetLoginButton();
            }
        }

        // Una vez cargado app.js, su propio handleLogin (misma firma) reemplaza a este.
        window.handleLogin = async function (e) {
            e.preventDefault();
            const btn = $('loginSubmitBtn'), box = $('loginError');
            if (!client) { alert('Error: No se pudo conectar con el servidor de base de datos. Verifique su conexión.'); return; }
            if (box) box.style.display = 'none';
            if (btn) { btn.textContent = 'Verificando...'; btn.disabled = true; }
            try {
                const { data, error } = await client.auth.signInWithPassword({ email: $('loginEmail').value, password: $('loginPassword').value });
                if (error) {
                    showLoginError(error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos' : error.message);
                    resetLoginButton();
                } else {
                    await loadApp(data.session);
                }
            } catch (err) {
                console.error('Excepción en login:', err);
                showLoginError('Error de conexión inesperado.');
                resetLoginButton();
            }
        };

        // Sesión ya iniciada de antes: entra directo.
        if (client) client.auth.getSession().then(({ data }) => { if (data && data.session) loadApp(data.session); });
    })();
    </script>
</body>
</html>
